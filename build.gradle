plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT'
    id 'maven-publish'
}

version = '1.0.0'
group = 'com.example.radiumaddon'

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.meteorclient.com/releases/' }
    maven { url 'https://maven.meteorclient.com/snapshots/' }
    maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft 'net.minecraft:minecraft:1.21.11'
    mappings 'net.fabricmc:yarn:1.21.11+build.1:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.15.11'
    modImplementation 'meteordevelopment:meteor-client:0.5.8-SNAPSHOT' 
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.0+1.21.11'
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
