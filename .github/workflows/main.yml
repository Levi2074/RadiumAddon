name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Force Custom Build Configuration
        run: |
          # Überschreibt die build.gradle mit einem reinen Java-Shadow-Build, der Loom komplett ignoriert
          cat << 'EOF' > build.gradle
          plugins {
              id 'java'
              id 'com.github.johnrengelman.shadow' version '8.1.1'
          }
          version = '1.0.0'
          group = 'com.example.radiumaddon'
          repositories {
              mavenCentral()
              maven { url 'https://meteorclient.com' }
          }
          dependencies {
              compileOnly 'meteordevelopment:meteor-client:0.5.8-SNAPSHOT'
          }
          tasks.withType(JavaCompile).configureEach { options.release = 21 }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Mod with ShadowJar
        run: gradle shadowJar --no-daemon

      - name: Upload Final Mod File
        uses: actions/upload-artifact@v4
        with:
          name: RadiumAddon-Jar
          path: build/libs/*-all.jar
