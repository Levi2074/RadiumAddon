name: Build Mod
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch Build Script for Stability
        run: |
          # Ersetzt die kaputte SNAPSHOT-Version durch das stabile Loom 1.7.4
          sed -i "s/id 'fabric-loom' version '.*'/id 'fabric-loom' version '1.7.4'/g" build.gradle
          sed -i "s/id(\"fabric-loom\") version \".*\"/id(\"fabric-loom\") version \"1.7.4\"/g" build.gradle

      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'
          cache-disabled: true

      - name: Force Wrapper Generation
        run: gradle wrapper --gradle-version 8.10.2

      - name: Grant Execute Permissions
        run: chmod +x gradlew
          
      - name: Clean And Build Mod
        run: ./gradlew clean build --no-daemon -x test
        
      - name: Upload Final Mod File
        uses: actions/upload-artifact@v4
        with:
          name: RadiumAddon-Jar
          path: build/libs/*.jar
